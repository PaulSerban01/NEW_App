<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConnAgri</title>
  <link rel="stylesheet" href="design-system/tokens.css">
    <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--brand-font-sans);
      background: var(--brand-surface);
      color: var(--brand-text-primary);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 48px 20px 40px;
      gap: 32px;
    }

    /* ── Logo ───────────────────────────────────────────── */
    .logo {
      font-size: 24px;
      font-weight: 800;
      color: var(--brand-primary);
      letter-spacing: -0.5px;
    }
    .logo span {
      display: block;
      font-size: 13px;
      font-weight: 400;
      color: var(--brand-text-muted);
      margin-top: 3px;
      letter-spacing: 0;
    }

    /* ── Cards — single column on mobile ───────────────── */
    .cards {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }

    .card {
      display: flex;
      align-items: center;
      gap: 16px;
      background: #fff;
      border: 1px solid var(--brand-border);
      border-radius: var(--brand-radius-lg);
      padding: 18px 20px;
      text-decoration: none;
      color: var(--brand-text-primary);
      transition: border-color 0.15s, box-shadow 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .card:active {
      border-color: var(--brand-primary);
      box-shadow: 0 2px 10px rgba(0,104,106,0.12);
    }

    .card-icon {
      width: 44px;
      height: 44px;
      border-radius: var(--brand-radius);
      background: var(--brand-hover-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .card-body { flex: 1; min-width: 0; }
    .card-title { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
    .card-desc  { font-size: 13px; color: var(--brand-text-muted); }

    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      margin-top: 5px;
    }
    .badge-stable { background: var(--brand-success-bg); color: var(--brand-success); }
    .badge-wip    { background: var(--brand-warning-bg); color: var(--brand-warning); }

    .card-arrow {
      font-size: 18px;
      color: var(--brand-border);
      flex-shrink: 0;
    }

    /* ── Tablet / desktop — row layout ─────────────────── */
    @media (min-width: 640px) {
      body { align-items: center; justify-content: center; padding: 40px 20px; }
      .logo { text-align: center; }
      .logo { font-size: 28px; }
      .cards { flex-direction: row; flex-wrap: wrap; justify-content: center; flex: unset; }
      .card {
        flex-direction: column;
        align-items: center;
        text-align: center;
        width: 200px;
        padding: 28px 24px;
        gap: 0;
      }
      .card-icon { margin-bottom: 12px; }
      .card-body { min-width: unset; }
      .card-arrow { display: none; }
    }
  </style>
</head>
<body>
  <div class="logo">ConnAgri <span>Design System &amp; Prototype</span></div>

  <div class="cards">
    <a class="card" href="prototype/main/roles.html">
      <div class="card-icon">📱</div>
      <div class="card-body">
        <div class="card-title">Prototype — Main</div>
        <div class="card-desc">Stable snapshot</div>
        <div class="badge badge-stable">stable</div>
      </div>
      <div class="card-arrow">›</div>
    </a>
    <a class="card" href="prototype/test/roles.html">
      <div class="card-icon">🔧</div>
      <div class="card-body">
        <div class="card-title">Prototype — Test</div>
        <div class="card-desc">Current working version</div>
        <div class="badge badge-wip">wip</div>
      </div>
      <div class="card-arrow">›</div>
    </a>
    <a class="card" href="design-system/preview/index.html">
      <div class="card-icon">🎨</div>
      <div class="card-body">
        <div class="card-title">Design System</div>
        <div class="card-desc">Tokens, themes &amp; components</div>
      </div>
      <div class="card-arrow">›</div>
    </a>
  </div>
</body>
</html>
