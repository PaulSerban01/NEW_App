<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConnAgri</title>
  <link rel="stylesheet" href="design-system/tokens.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--brand-font-sans);
      background: var(--brand-surface);
      color: var(--brand-text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 40px 20px;
    }
    .logo { font-size: 28px; font-weight: 800; color: var(--brand-primary); letter-spacing: -0.5px; }
    .logo span { color: var(--brand-text-muted); font-weight: 400; font-size: 14px; display: block; margin-top: 4px; letter-spacing: 0; }
    .cards { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
    .card {
      background: #fff;
      border: 1px solid var(--brand-border);
      border-radius: var(--brand-radius-lg);
      padding: 28px 32px;
      text-decoration: none;
      color: var(--brand-text-primary);
      min-width: 200px;
      text-align: center;
      transition: box-shadow 0.15s, border-color 0.15s;
    }
    .card:hover { border-color: var(--brand-primary); box-shadow: 0 4px 16px rgba(0,104,106,0.12); }
    .card-icon { font-size: 32px; margin-bottom: 12px; }
    .card-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .card-desc { font-size: 13px; color: var(--brand-text-muted); }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      margin-top: 8px;
    }
    .badge-stable { background: var(--brand-success-bg); color: var(--brand-success); }
    .badge-wip    { background: var(--brand-warning-bg); color: var(--brand-warning); }
  </style>
</head>
<body>
  <div class="logo">ConnAgri <span>Design System &amp; Prototype</span></div>

  <div class="cards">
    <a class="card" href="prototype/main/roles.html">
      <div class="card-icon">📱</div>
      <div class="card-title">Prototype — Main</div>
      <div class="card-desc">Stable snapshot</div>
      <div class="badge badge-stable">stable</div>
    </a>
    <a class="card" href="prototype/test/roles.html">
      <div class="card-icon">🔧</div>
      <div class="card-title">Prototype — Test</div>
      <div class="card-desc">Current working version</div>
      <div class="badge badge-wip">wip</div>
    </a>
    <a class="card" href="design-system/preview/index.html">
      <div class="card-icon">🎨</div>
      <div class="card-title">Design System</div>
      <div class="card-desc">Tokens, themes &amp; components</div>
    </a>
  </div>
</body>
</html>
