<!doctype html>
<html lang="en" data-palette="teal" data-mode="light">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=1280">
  <title>Textarea · Rurio</title>
  <link rel="stylesheet" href="../../tokens.css">
  <link rel="stylesheet" href="../shared/site.css">
  <link rel="stylesheet" href="../shared/components.css">
</head>
<body data-crumb="Components" data-title="Textarea">
  <div class="ds-layout">
    <aside id="ds-sidebar" class="ds-sidebar"></aside>
    <main class="ds-main">
      <header id="ds-topbar" class="ds-topbar"></header>
      <div class="ds-content">

        <div class="ds-page-header">
          <div class="ds-eyebrow">Component</div>
          <h1 class="ds-page-title">Textarea</h1>
          <p class="ds-page-desc">Mirrors Catalyst's <code class="ds-inline">Textarea</code> + <code class="ds-inline">Field</code> primitives 1:1.</p>
        </div>

        <!-- 1. Basic -->
        <section class="ds-section">
          <h2 class="ds-section__title">Basic example</h2>
          <div class="ds-board">
            <div class="ds-row" style="min-height: 160px; align-items: center; justify-content: center;">
              <span class="cat-textarea cat-control" style="max-width: 480px;">
                <textarea class="cat-textarea__input" aria-label="Description" name="description" rows="3"></textarea>
              </span>
            </div>
          </div>
        </section>

        <!-- 2. With label -->
        <section class="ds-section">
          <h2 class="ds-section__title">With label</h2>
          <div class="ds-board">
            <div class="ds-row" style="min-height: 200px; align-items: center; justify-content: center;">
              <div class="cat-field" style="width: 100%; max-width: 480px;">
                <label class="cat-label" for="ta-2">Description</label>
                <span class="cat-textarea cat-control">
                  <textarea id="ta-2" class="cat-textarea__input" name="description" rows="3"></textarea>
                </span>
              </div>
            </div>
          </div>
        </section>

        <!-- 3. With description -->
        <section class="ds-section">
          <h2 class="ds-section__title">With description</h2>
          <div class="ds-board">
            <div class="ds-row" style="min-height: 220px; align-items: center; justify-content: center;">
              <div class="cat-field" style="width: 100%; max-width: 480px;">
                <label class="cat-label" for="ta-3">Description</label>
                <span class="cat-description">This will be shown under the product title.</span>
                <span class="cat-textarea cat-control">
                  <textarea id="ta-3" class="cat-textarea__input" name="name" rows="3"></textarea>
                </span>
              </div>
            </div>
          </div>
        </section>

        <!-- 4. Disabled -->
        <section class="ds-section">
          <h2 class="ds-section__title">Disabled state</h2>
          <div class="ds-board">
            <div class="ds-row" style="min-height: 200px; align-items: center; justify-content: center;">
              <div class="cat-field cat-field--disabled" style="width: 100%; max-width: 480px;">
                <label class="cat-label" for="ta-4">Description</label>
                <span class="cat-textarea cat-control">
                  <textarea id="ta-4" class="cat-textarea__input" name="description" rows="3" disabled></textarea>
                </span>
              </div>
            </div>
          </div>
        </section>

        <!-- 5. Validation errors -->
        <section class="ds-section">
          <h2 class="ds-section__title">Validation errors</h2>
          <div class="ds-board">
            <div class="ds-row" style="min-height: 240px; align-items: center; justify-content: center;">
              <div class="cat-field" style="width: 100%; max-width: 480px;">
                <label class="cat-label" for="ta-5">Description</label>
                <span class="cat-textarea cat-control cat-textarea--invalid">
                  <textarea id="ta-5" class="cat-textarea__input" name="description" rows="3" aria-invalid="true"></textarea>
                </span>
                <span class="cat-error">Description is required.</span>
              </div>
            </div>
          </div>
        </section>

      </div>
    </main>
  </div>

  <script src="../shared/site.js"></script>
</body>
</html>
