<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="../manifest.json">
  <title>Contul Meu — ConnAgri</title>
  <link rel="stylesheet" href="../design-system.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    svg.lucide { width:1em; height:1em; vertical-align:middle; display:inline-block; flex-shrink:0; }
    .section-label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:var(--brand-text-muted); padding:20px 20px 6px; }
    .menu-row { display:flex; align-items:center; gap:14px; padding:15px 20px; background:var(--brand-background); border-bottom:1px solid var(--brand-border); cursor:pointer; text-decoration:none; color:var(--brand-text-primary); font-size:15px; }
    .menu-row:active { background:var(--brand-hover-bg); }
    .menu-row .row-icon { width:34px; height:34px; border-radius:8px; background:var(--brand-hover-bg); color:var(--brand-primary); display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0; }
    .menu-row .row-label { flex:1; font-weight:500; }
    .menu-row .row-arrow { color:var(--brand-text-muted); font-size:15px; }
  </style>
</head>
<body>
<div class="preview-root">
  <div class="phone-screen">

    <!-- Topbar -->
    <div class="app-topbar" style="background:var(--brand-primary); display:flex; align-items:center; justify-content:space-between; padding:7px 16px; flex-shrink:0;">
      <a href="javascript:history.back()" style="width:32px; height:32px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:21px; text-decoration:none;"><i data-lucide="chevron-left"></i></a>
      <div style="font-size:16px; font-weight:700; color:#fff;">Contul Meu</div>
      <div style="width:32px;"></div>
    </div>

    <div class="phone-scroll">

      <!-- User header -->
      <div style="background:var(--brand-primary); padding:20px 20px 24px; display:flex; align-items:center; gap:14px;">
        <div style="width:54px; height:54px; border-radius:50%; background:#fff; color:var(--brand-primary); display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:800; flex-shrink:0;">IP</div>
        <div style="flex:1;">
          <div style="font-size:17px; font-weight:700; color:#fff;">Ion Popescu</div>
          <div style="font-size:13px; color:rgba(255,255,255,0.75); margin-top:2px;">ion.popescu@agrovest.ro</div>
        </div>
        <a href="user.html" style="width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,0.2); display:flex; align-items:center; justify-content:center; color:#fff; font-size:16px; text-decoration:none;"><i data-lucide="pencil"></i></a>
      </div>

      <!-- Account section -->
      <div class="section-label">Cont</div>
      <div style="border-top:1px solid var(--brand-border);">
        <a href="user.html" class="menu-row">
          <div class="row-icon"><i data-lucide="user"></i></div>
          <span class="row-label">Profil Utilizator</span>
          <span class="row-arrow"><i data-lucide="chevron-right"></i></span>
        </a>
        <div class="menu-row" onclick="alert('Setari Aplicatie')">
          <div class="row-icon"><i data-lucide="settings"></i></div>
          <span class="row-label">Setari Aplicatie</span>
          <span class="row-arrow"><i data-lucide="chevron-right"></i></span>
        </div>
      </div>

      <!-- Accessibility section -->
      <div class="section-label">Accesibilitate</div>
      <div style="border-top:1px solid var(--brand-border);">
        <div class="menu-row" style="cursor:default;">
          <div class="row-icon"><i data-lucide="type"></i></div>
          <span class="row-label">Marime text</span>
          <div style="display:flex; border:1px solid var(--brand-border); border-radius:8px; overflow:hidden; flex-shrink:0;">
            <div id="ts-small" onclick="setTextSize(-2)" style="padding:5px 10px; cursor:pointer; font-size:12px; font-weight:700; background:#fff; color:var(--brand-text-primary); border-right:1px solid var(--brand-border);">A&#8722;</div>
            <div id="ts-normal" onclick="setTextSize(0)" style="padding:5px 10px; cursor:pointer; font-size:14px; font-weight:700; background:#fff; color:var(--brand-text-primary); border-right:1px solid var(--brand-border);">A</div>
            <div id="ts-large" onclick="setTextSize(2)" style="padding:5px 10px; cursor:pointer; font-size:16px; font-weight:700; background:#fff; color:var(--brand-text-primary);">A&#43;</div>
          </div>
        </div>
        <div class="menu-row" style="cursor:default;">
          <div class="row-icon"><i data-lucide="moon"></i></div>
          <span class="row-label">Dark mode</span>
          <div onclick="toggleDarkMode()" id="dark-toggle" style="width:40px; height:22px; border-radius:11px; background:#ccc; position:relative; cursor:pointer; transition:background 0.2s; flex-shrink:0;">
            <div id="dark-knob" style="width:18px; height:18px; border-radius:50%; background:#fff; position:absolute; top:2px; left:2px; transition:left 0.2s;"></div>
          </div>
        </div>
      </div>

      <!-- Legal section -->
      <div class="section-label">Legal</div>
      <div style="border-top:1px solid var(--brand-border);">
        <div class="menu-row" onclick="alert('Termeni si Conditii')">
          <div class="row-icon"><i data-lucide="file-text"></i></div>
          <span class="row-label">Termeni si Conditii</span>
          <span class="row-arrow"><i data-lucide="chevron-right"></i></span>
        </div>
      </div>

      <!-- Logout -->
      <div style="padding:24px 20px 40px;">
        <button onclick="window.location.href='../roles.html'" style="display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:14px; background:var(--brand-danger-bg); color:var(--brand-danger); border:1px solid var(--brand-danger); border-radius:var(--brand-radius); font-size:15px; font-weight:700; font-family:inherit; cursor:pointer;">
          <i data-lucide="log-out"></i> Iesire din cont
        </button>
      </div>

    </div><!-- /.phone-scroll -->

  </div><!-- /.phone-screen -->
</div><!-- /.preview-root -->

<script>lucide.createIcons();</script>
<script>
  // Dark mode
  (function() {
    var dm = localStorage.getItem('connagri-dark') === 'true';
    if (dm) { document.body.classList.add('dark-mode'); document.getElementById('dark-toggle').style.background = 'var(--brand-primary)'; document.getElementById('dark-knob').style.left = '20px'; }
  })();
  function toggleDarkMode() {
    var dm = document.body.classList.toggle('dark-mode');
    localStorage.setItem('connagri-dark', dm);
    document.getElementById('dark-toggle').style.background = dm ? 'var(--brand-primary)' : '#ccc';
    document.getElementById('dark-knob').style.left = dm ? '20px' : '2px';
  }

  // Text size indicator
  (function() {
    var offset = parseInt(localStorage.getItem('connagri-text-size') || '0');
    var active = offset === -2 ? 'ts-small' : offset === 2 ? 'ts-large' : 'ts-normal';
    document.getElementById(active).style.background = 'var(--brand-hover-bg)';
  })();
  function setTextSize(offset) {
    localStorage.setItem('connagri-text-size', offset);
    ['ts-small','ts-normal','ts-large'].forEach(function(id){ document.getElementById(id).style.background = '#fff'; });
    var active = offset === -2 ? 'ts-small' : offset === 2 ? 'ts-large' : 'ts-normal';
    document.getElementById(active).style.background = 'var(--brand-hover-bg)';
  }
</script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js');</script>
</body>
</html>
