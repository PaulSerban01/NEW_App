<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="../manifest.json">
  <title>Arenda — UI Preview</title>
  <link rel="stylesheet" href="../design-system.css">
  <style>
  /* Lucide icons */
  svg.lucide { width:1em; height:1em; vertical-align:middle; display:inline-block; flex-shrink:0; }
    .preview-root { display: flex; height: 100%; gap: 0; overflow-y: hidden; }
    .browser-chrome { border: 1px solid #d4d4d4; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .browser-bar { background: #f3f3f3; padding: 10px 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #e5e5e5; }
    .browser-dots { display: flex; gap: 6px; }
    .browser-dots span { width: 12px; height: 12px; border-radius: 50%; }
    .browser-dots span:nth-child(1) { background: #FF5F57; }
    .browser-dots span:nth-child(2) { background: #FFBD2E; }
    .browser-dots span:nth-child(3) { background: #28CA41; }
    .browser-url { flex: 1; background: #fff; border: 1px solid #e5e5e5; border-radius: 6px; padding: 4px 10px; font-size: 13px; color: #888; }
    .browser-screen { background: var(--brand-background); min-height: 600px; overflow-y: auto; }
    .spec-section { margin-bottom: 20px; }
    .spec-section h3 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #888; margin-bottom: 8px; }
  </style>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>


<div class="preview-root">
      <div class="phone-screen">
        <div id="app-topbar" data-title="Arenda"></div>
        <div class="view-tabs"><button class="view-tab active">Contracte</button><button class="view-tab">Creanțe</button></div>
        <div class="toolbar">
          <div class="toolbar-pill" onclick="selectAllVisible()"><i data-lucide="square"></i> Toate</div>
          <div class="toolbar-icon-btn" id="sort-btn" onclick="event.stopPropagation();toggleSortDD()"><i data-lucide="arrows-up-down"></i></div>
          <div class="sort-dropdown" id="sort-dd">
            <div class="sort-option" data-field="name" onclick="sortCards('name')"><span class="sort-arrow"><i data-lucide="arrow-down"></i></span> Proprietar</div>
            <div class="sort-option" data-field="type" onclick="sortCards('type')"><span class="sort-arrow"><i data-lucide="arrow-up"></i></span> Tip contract</div>
            <div class="sort-option" data-field="status" onclick="sortCards('status')"><span class="sort-arrow"><i data-lucide="arrow-up"></i></span> Status</div>
            <div class="sort-option" data-field="updated" onclick="sortCards('updated')"><span class="sort-arrow"><i data-lucide="arrow-up"></i></span> Ultima actualizare</div>
          </div>
          <div class="toolbar-search"><span class="toolbar-search-icon"><i data-lucide="search"></i></span><span class="toolbar-search-text">Cauta / filtreaza</span><span class="toolbar-search-arrow"><i data-lucide="chevron-down"></i></span></div>
          <button class="toolbar-add" onclick="openAddDrawer()">+</button>
          <div class="filter-dropdown" id="filter-dd"></div>
        </div>
        <div class="phone-scroll" id="card-list" style="padding-bottom:100px;"><div style="padding-top:8px;"></div></div>
        <button class="fab"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="4" y1="8" x2="16" y2="8"/><line x1="4" y1="14" x2="14" y2="14"/><line x1="19" y1="11" x2="19" y2="17"/><line x1="16" y1="14" x2="22" y2="14"/></svg></button>
        <div id="app-bottombar"></div>
        <script src="../bars.js"></script>
      </div>
</div>

<script src="../components.js"></script>
<script>
initFilterDropdown([
  { key: 'tip', label: 'TIP CONTRACT', pills: [{ text: 'Arenda' }, { text: 'Concesiune' }, { text: 'Comodat' }, { text: 'Schimb' }]},
  { key: 'stat', label: 'STATUS', pills: [{ text: 'Activ' }, { text: 'Expirat' }, { text: 'In negociere' }, { text: 'Reziliat' }]}
]);
var arenda = [
  { name: 'Maria Ionescu', value: '15.0', unit: 'ha', number: ['Ion Popescu', 'Vasile Lungu'], type: 'Arenda', icons: ['<i data-lucide="bell"></i>'], status: 'Activ', details: ['Expira: iun.2027'] },
  { name: 'Gheorghe Stanescu', value: '32.5', unit: 'ha', number: 'Vasile Lungu', type: 'Arenda', status: 'Activ', details: ['Expira: dec.2027'] },
  { name: 'Elena Dragomir', value: '8.0', unit: 'ha', number: 'Ion Popescu', type: 'Concesiune', status: 'Activ', details: ['Expira: mar.2028'] },
  { name: 'Nicolae Barbu', value: '22.3', unit: 'ha', number: 'Andrei Popa', type: 'Arenda', status: 'Scadent', statusColor: '#B7791F', details: ['Expira: iun.2026'] },
  { name: 'Primaria Timisoara', value: '45.0', unit: 'ha', number: ['Ion Popescu', 'Andrei Popa', 'Vasile Lungu'], type: 'Concesiune', icons: ['<i data-lucide="bell"></i>'], status: 'Activ', details: ['Expira: sep.2029'] },
  { name: 'Ioana Marin', value: '12.7', unit: 'ha', number: 'Vasile Lungu', type: 'Arenda', status: 'Expirat', statusColor: '#C0392B', details: ['Expira: feb.2026'] },
  { name: 'Dan Gheorghe', value: '5.5', unit: 'ha', number: 'Ion Popescu', type: 'Schimb', status: 'Activ', details: ['Expira: nov.2027'] },
  { name: 'Petru Moldovan', value: '18.9', unit: 'ha', number: ['Andrei Popa', 'Ion Popescu'], type: 'Arenda', icons: ['<i data-lucide="bell"></i>'], status: 'Scadent', statusColor: '#B7791F', details: ['Expira: mai.2026'] },
  { name: 'Ana Popescu', value: '27.0', unit: 'ha', number: 'Ion Popescu', type: 'Arenda', status: 'Activ', details: ['Expira: aug.2028'] },
  { name: 'Consiliul Local Lugoj', value: '60.0', unit: 'ha', number: 'Vasile Lungu', type: 'Concesiune', status: 'Activ', details: ['Expira: ian.2030'] },
  { name: 'Mihai Constantinescu', value: '9.3', unit: 'ha', number: 'Andrei Popa', type: 'Comodat', status: 'Expirat', statusColor: '#C0392B', details: ['Expira: ian.2026'] }
];
var list = document.getElementById('card-list');
arenda.forEach(function(a) { list.insertAdjacentHTML('beforeend', buildCardArenda(a)); });

initFabActions([
  { icon: '<i data-lucide="plus"></i>', label: 'Adauga contract', action: function(){ openAddDrawer(); } },
  { icon: '<i data-lucide="trash-2"></i>', label: 'Sterge contract', action: function(){ tryFabDelete(); } },
  { icon: '<i data-lucide="file"></i>', label: 'Exporta contracte', action: function(){ alert('Exporta contracte'); } }
]);
setupFabDelete({ cardSel: '.ucard-arenda', entityLabel: 'contract', entityLabelPl: 'contracte', labelText: 'Sterge contract' });

function openAddDrawer() {
  var formHTML = buildForm([
    { label: 'Proprietar', type: 'text', placeholder: 'ex: Maria Ionescu', required: true },
    { label: 'Teren arendat', type: 'select', options: ['Parcela Nord-Est', 'Parcela Sud', 'Lotul 3 Vest'], required: true },
    { label: 'Suprafata (ha)', type: 'text', placeholder: 'ex: 15.0' },
    { label: 'Pret arenda (lei/ha)', type: 'text', placeholder: 'ex: 800' },
    { label: 'Data inceput', type: 'date', required: true },
    { label: 'Data sfarsit', type: 'date' },
    { label: 'Observatii', type: 'textarea', placeholder: 'Note...' }
  ]);
  openDrawer('Adauga Contract Arenda', formHTML, [
    { label: 'Anuleaza', class: 'btn-secondary', action: closeDrawer },
    { label: 'Salveaza', class: 'btn-primary', action: function() { closeDrawer(); showToast('success', 'Contract adaugat cu succes.'); } }
  ]);
}
</script>
<script>lucide.createIcons();</script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js');</script>
</body>
</html>
