<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="../manifest.json">
  <title>Firme — UI Preview</title>
  <link rel="stylesheet" href="../design-system.css">
  <style>
  /* Lucide icons */
  svg.lucide { width:1em; height:1em; vertical-align:middle; display:inline-block; flex-shrink:0; }
    .preview-root { display: flex; height: 100%; gap: 0; overflow-y: hidden; }
    .browser-chrome { border: 1px solid #d4d4d4; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .browser-bar { background: #f3f3f3; padding: 10px 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #e5e5e5; }
    .browser-dots { display: flex; gap: 6px; }
    .browser-dots span { width: 12px; height: 12px; border-radius: 50%; }
    .browser-dots span:nth-child(1) { background: #FF5F57; }
    .browser-dots span:nth-child(2) { background: #FFBD2E; }
    .browser-dots span:nth-child(3) { background: #28CA41; }
    .browser-url { flex: 1; background: #fff; border: 1px solid #e5e5e5; border-radius: 6px; padding: 4px 10px; font-size: 13px; color: #888; }
    .browser-screen { background: var(--brand-background); min-height: 600px; overflow-y: auto; }
    .spec-section { margin-bottom: 20px; }
    .spec-section h3 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #888; margin-bottom: 8px; }
  </style>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>


<div class="preview-root">
      <div class="phone-screen">
        <div id="app-topbar" data-title="Firme"></div>
        <div class="view-tabs"><button class="view-tab active">Firme</button><button class="view-tab">Puncte de lucru</button></div>
        <div class="toolbar">
          <div class="toolbar-pill" onclick="selectAllVisible()"><i data-lucide="square"></i> Toate</div>
          <div class="toolbar-icon-btn" id="sort-btn" onclick="event.stopPropagation();toggleSortDD()"><i data-lucide="arrows-up-down"></i></div>
          <div class="sort-dropdown" id="sort-dd">
            <div class="sort-option" data-field="name" onclick="sortCards('name')"><span class="sort-arrow"><i data-lucide="arrow-down"></i></span> Denumire</div>
            <div class="sort-option" data-field="type" onclick="sortCards('type')"><span class="sort-arrow"><i data-lucide="arrow-up"></i></span> Localitate</div>
            <div class="sort-option" data-field="status" onclick="sortCards('status')"><span class="sort-arrow"><i data-lucide="arrow-up"></i></span> Abonament</div>
            <div class="sort-option" data-field="updated" onclick="sortCards('updated')"><span class="sort-arrow"><i data-lucide="arrow-up"></i></span> Ultima actualizare</div>
          </div>
          <div class="toolbar-search"><span class="toolbar-search-icon"><i data-lucide="search"></i></span><span class="toolbar-search-text">Cauta / filtreaza</span><span class="toolbar-search-arrow"><i data-lucide="chevron-down"></i></span></div>
          <button class="toolbar-add" onclick="openAddDrawer()">+</button>
          <div class="filter-dropdown" id="filter-dd"></div>
        </div>
        <div class="phone-scroll" id="card-list" style="padding-bottom:100px;"><div style="padding-top:8px;"></div></div>
        <button class="fab"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="4" y1="8" x2="16" y2="8"/><line x1="4" y1="14" x2="14" y2="14"/><line x1="19" y1="11" x2="19" y2="17"/><line x1="16" y1="14" x2="22" y2="14"/></svg></button>
        <div id="app-bottombar"></div>
        <script src="../bars.js"></script>
      </div>
</div>

<script src="../components.js"></script>
<script>
initFilterDropdown([
  { key: 'tip', label: 'TIP', pills: [{ text: 'SRL' }, { text: 'SA' }, { text: 'PFA' }, { text: 'II' }]},
  { key: 'stat', label: 'STATUS', pills: [{ text: 'Activa' }, { text: 'Suspendata' }, { text: 'Radiata' }]}
]);
var firme = [
  { name: 'Agro Vest SRL', number: 'RO12345678', type: 'Timis, Timisoara', status: 'Activ', details: ['Premium','Exp: Dec 2027'], updated: 'Grup: Agro Vest Holdings' },
  { name: 'Agro Vest Cereale SRL', number: 'RO23456789', type: 'Timis, Timisoara', status: 'Activ', details: ['Premium','Exp: Dec 2027'], updated: 'Grup: Agro Vest Holdings' },
  { name: 'Ferma Constanta SRL', number: 'RO34567890', type: 'Constanta, Constanta', status: 'Activ', details: ['Standard','Exp: Mar 2027'], updated: 'Grup: Ferma Constanta' },
  { name: 'AgroTim SRL', number: 'RO45678901', type: 'Timis, Lugoj', status: 'Activ', details: ['Premium','Exp: Ian 2028'] },
  { name: 'Cereale Banat SA', number: 'RO56789012', type: 'Timis, Recas', status: 'Scadent', statusColor: '#B7791F', details: ['Standard','Exp: Sep 2026'] },
  { name: 'Bio Farm Arad SRL', number: 'RO67890123', type: 'Arad, Arad', status: 'Activ', details: ['Premium','Exp: Nov 2027'] },
  { name: 'Pomicola Bistrita SRL', number: 'RO78901234', type: 'Bistrita-Nasaud, Bistrita', status: 'Scadent', statusColor: '#B7791F', details: ['Trial','Exp: Iun 2026'] },
  { name: 'Vita de Vie Recas SRL', number: 'RO89012345', type: 'Timis, Recas', status: 'Activ', details: ['Standard','Exp: Aug 2027'] },
  { name: 'Legume Dolj PFA', number: 'RO90123456', type: 'Dolj, Craiova', status: 'Expirat', statusColor: '#C0392B', details: ['Standard','Exp: Mar 2026'] },
  { name: 'Sere Braila SRL', number: 'RO01234567', type: 'Braila, Braila', status: 'Activ', details: ['Standard','Exp: Feb 2027'] },
  { name: 'Orizarii Ialomita II', number: 'RO11223344', type: 'Ialomita, Slobozia', status: 'Activ', details: ['Premium','Exp: Dec 2027'] }
];
var list = document.getElementById('card-list');
firme.forEach(function(f) { list.insertAdjacentHTML('beforeend', buildCard(f)); });

initFabActions([
  { icon: '<i data-lucide="plus"></i>', label: 'Adauga firma', action: function(){ openAddDrawer(); } },
  { icon: '<i data-lucide="trash-2"></i>', label: 'Sterge firma', action: function(){ tryFabDelete(); } },
  { icon: '<i data-lucide="file"></i>', label: 'Exporta firme', action: function(){ alert('Exporta firme'); } }
]);
setupFabDelete({ cardSel: '.ucard', entityLabel: 'firmă', entityLabelPl: 'firme', labelText: 'Sterge firma' });

function openAddDrawer() {
  var formHTML = buildForm([
    { label: 'Denumire firma', type: 'text', placeholder: 'ex: Agro Vest SRL', required: true },
    { label: 'CUI', type: 'text', placeholder: 'ex: RO12345678', required: true },
    { label: 'Nr. Reg. Comert', type: 'text', placeholder: 'ex: J35/1234/2020' },
    { label: 'Adresa sediu', type: 'text', placeholder: 'ex: Str. Recoltei 15, Timisoara' },
    { label: 'Telefon', type: 'text', placeholder: '07xx xxx xxx' },
    { label: 'Observatii', type: 'textarea', placeholder: 'Note...' }
  ]);
  openDrawer('Adauga Firma', formHTML, [
    { label: 'Anuleaza', class: 'btn-secondary', action: closeDrawer },
    { label: 'Salveaza', class: 'btn-primary', action: function() { closeDrawer(); showToast('success', 'Firma adaugata cu succes.'); } }
  ]);
}
</script>
<script>lucide.createIcons();</script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js');</script>
</body>
</html>
