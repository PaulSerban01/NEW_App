<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <title>Autentificare — ConnAgri</title>
  <style>
  /* Lucide icons */
  svg.lucide { width:1em; height:1em; vertical-align:middle; display:inline-block; flex-shrink:0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #fff;
      width: 100%;
      max-width: 400px;
      height: 100vh;
      padding: 32px 16px;
    }

    .logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo-mark {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      background: #00686A;
      padding: 8px 18px;
      border-radius: 10px;
      letter-spacing: 3px;
      margin-bottom: 8px;
    }
    .logo-sub {
      font-size: 13px;
      color: #4A6E6E;
      margin-top: 6px;
    }

    /* Form */
    .form-group { margin-bottom: 16px; }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #0D2626;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #D0E5E5;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      color: #0D2626;
      background: #F7FAFA;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: #00686A; background: #fff; }

    .forgot {
      display: block;
      text-align: right;
      font-size: 13px;
      color: #00686A;
      text-decoration: none;
      margin-top: 6px;
    }
    .forgot:hover { text-decoration: underline; }

    .btn-login {
      width: 100%;
      padding: 13px;
      background: #00686A;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      margin-top: 24px;
      transition: background 0.15s;
    }
    .btn-login:hover { background: #005557; }

    /* Separator */
    .separator {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 28px 0 24px;
    }
    .separator::before, .separator::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #D0E5E5;
    }
    .separator span {
      font-size: 13px;
      color: #4A6E6E;
      white-space: nowrap;
    }

    /* Role buttons */
    .roles-label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #4A6E6E;
      margin-bottom: 12px;
    }
    .role-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 12px 16px;
      background: #F7FAFA;
      border: 1px solid #D0E5E5;
      border-radius: 10px;
      text-decoration: none;
      color: #0D2626;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
      transition: background 0.15s, border-color 0.15s;
    }
    .role-btn:last-child { margin-bottom: 0; }
    .role-btn:hover { background: #E6F3F3; border-color: #00686A; color: #00686A; }
    .role-btn .role-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: #CCE1E1;
      color: #00686A;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      flex-shrink: 0;
    }
    .role-btn .role-info { flex: 1; text-align: left; }
    .role-btn .role-name { font-size: 15px; font-weight: 600; color: inherit; }
    .role-btn .role-user { font-size: 13px; font-weight: 400; color: #4A6E6E; margin-top: 1px; }
    .role-btn .role-arrow { font-size: 16px; color: #99C2C3; }
    .role-btn:disabled, .role-btn[aria-disabled="true"] {
      opacity: 0.45;
      cursor: not-allowed;
      pointer-events: none;
      background: #F7FAFA;
      border-color: #D0E5E5;
      color: #0D2626;
    }
  </style>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
  <div class="card">

    <div class="logo">
      <div class="logo-mark">CONNAGRI</div>
      <div class="logo-sub">Platforma agricola integrata</div>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="nume@exemplu.ro" autocomplete="username" />
    </div>

    <div class="form-group">
      <label for="password">Parola</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
      <a href="#" class="forgot">Am uitat parola</a>
    </div>

    <button class="btn-login" onclick="alert('Login')">Autentificare</button>

    <div class="separator"><span>sau continua ca</span></div>

    <div class="roles-label">Conturi demo</div>

    <a class="role-btn" href="modules/newdash.html">
      <div class="role-icon"><i data-lucide="user"></i></div>
      <div class="role-info">
        <div class="role-name">Administrator</div>
        <div class="role-user">Andrei Popescu</div>
      </div>
      <span class="role-arrow">&#8250;</span>
    </a>

    <a class="role-btn" aria-disabled="true">
      <div class="role-icon"><i data-lucide="users"></i></div>
      <div class="role-info">
        <div class="role-name">User</div>
        <div class="role-user">Maria Ionescu</div>
      </div>
      <span class="role-arrow">&#8250;</span>
    </a>

    <a class="role-btn" aria-disabled="true">
      <div class="role-icon"><i data-lucide="settings"></i></div>
      <div class="role-info">
        <div class="role-name">Ops</div>
        <div class="role-user">Ion Dumitrescu</div>
      </div>
      <span class="role-arrow">&#8250;</span>
    </a>

    <a class="role-btn" aria-disabled="true">
      <div class="role-icon"><i data-lucide="wrench"></i></div>
      <div class="role-info">
        <div class="role-name">Operator</div>
        <div class="role-user">Elena Stan</div>
      </div>
      <span class="role-arrow">&#8250;</span>
    </a>

  </div>
<script>lucide.createIcons();</script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');</script>
</body>
</html>
