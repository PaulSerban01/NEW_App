<!DOCTYPE html>
<html lang="ro" data-palette="teal" data-mode="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rurio — Prototype Test</title>
  <link rel="stylesheet" href="dist/app.css" />
  <script type="module" src="lib/theme-engine.js"></script>
  <script type="module" src="lib/icons.js"></script>
  <script type="module" src="../../design-system/components/index.js"></script>
  <style>
    /* Mobile drawer slide animation (CSS-only, respects prefers-reduced-motion). */
    .pane-nav-drawer {
      transform: translateX(-100%);
      transition: transform var(--duration-base, 220ms) var(--ease-emphasized, cubic-bezier(.3,0,0,1)),
                  box-shadow var(--duration-base, 220ms) var(--ease-standard, cubic-bezier(.2,0,0,1));
      box-shadow: none; /* shadow only while open — otherwise it leaks past the screen edge */
    }
    [data-nav-open="true"] .pane-nav-drawer {
      transform: translateX(0);
      box-shadow: var(--shadow-xl);
    }
    [data-nav-open="true"] .pane-nav-backdrop { opacity: 1; pointer-events: auto; }
    .pane-nav-backdrop {
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--duration-base, 220ms) var(--ease-standard, cubic-bezier(.2,0,0,1));
    }

    /* Mobile: when a detail is active, hide the list pane to slide detail full-screen. */
    @media (max-width: 1279.98px) {
      [data-has-detail] #pane-list { display: none; }
    }

    /* Desktop ≥ 1280px: 3-pane grid — 15% / 25% / 60% */
    @media (min-width: 1280px) {
      .app-shell {
        display: grid;
        grid-template-columns: minmax(0, 15%) minmax(0, 25%) minmax(0, 60%);
        grid-template-rows: 100dvh;
      }
      .pane-nav-drawer {
        position: static !important;
        transform: none !important;
        width: auto !important;
        max-width: none !important;
        height: 100dvh;
        border-right: 1px solid var(--border-subtle);
      }
      .pane-nav-backdrop { display: none; }
      #pane-list { border-right: 1px solid var(--border-subtle); overflow-y: auto; }
      #pane-detail { overflow-y: auto; display: block !important; }
      .header-mobile { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .pane-nav-drawer, .pane-nav-backdrop { transition: none; }
    }
  </style>
</head>

<body class="min-h-dvh bg-canvas text-fg antialiased">

  <div class="app-shell relative pt-16 xl:pt-0">

    <!-- Mobile header (hidden on xl). Fixed at viewport top; app-shell pt-16 reserves its space. -->
    <header class="header-mobile fixed inset-x-0 top-0 z-30 flex items-center gap-2 bg-surface p-3">
      <!-- Home button (visible when no detail open) -->
      <a id="home-btn" href="#/" aria-label="Acasă"
         class="flex size-10 items-center justify-center rounded-lg text-fg hover:bg-subtle">
        <i data-lucide="home" class="size-5"></i>
      </a>
      <!-- Back button (visible when current route has a detail id) -->
      <button id="back-btn"
              type="button"
              aria-label="Înapoi"
              class="hidden size-10 items-center justify-center rounded-lg text-fg hover:bg-subtle">
        <i data-lucide="chevron-left" class="size-5"></i>
      </button>
      <div class="flex-1 text-center text-base font-semibold text-fg" id="header-title">Rurio</div>
      <!-- Profile avatar — 24×24 image inside a 40×40 tap target (matches home button).
           Becomes `invisible` on /profile so the slot still reserves space and the title stays centered. -->
      <a id="header-avatar" href="#/profile" aria-label="Profil"
         class="flex size-10 shrink-0 items-center justify-center rounded-lg transition-opacity hover:opacity-80 hover:bg-subtle">
        <span class="block size-6 overflow-hidden rounded-full bg-accent">
          <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?auto=format&fit=facearea&facepad=2&w=128&h=128&q=80"
               alt=""
               loading="lazy"
               class="size-full object-cover" />
        </span>
      </a>
    </header>

    <!-- Nav pane: drawer on mobile, sidebar on xl -->
    <div class="pane-nav-backdrop fixed inset-0 z-40 bg-black/40 xl:hidden" id="nav-backdrop"></div>
    <aside class="pane-nav-drawer fixed inset-y-0 left-0 z-50 w-72 max-w-[85%] bg-surface"
           id="pane-nav">
      <rurio-nav id="rurio-nav"></rurio-nav>
    </aside>

    <!-- List pane (mobile: full viewport; xl: middle column).
         pb-20 leaves room for the fixed bottom nav on mobile. -->
    <main id="pane-list" class="min-h-0 pb-[calc(5rem+env(safe-area-inset-bottom,0))] xl:pb-0"></main>

    <!-- Detail pane (mobile: full viewport when route has id; xl: right column) -->
    <aside id="pane-detail" class="min-h-0 pb-[calc(5rem+env(safe-area-inset-bottom,0))] xl:pb-0"></aside>

    <!-- Bottom navigation (mobile only; hidden on xl) -->
    <rurio-bottom-nav id="rurio-bottom-nav"></rurio-bottom-nav>

  </div>

  <script type="module">
    import * as pages from "./pages/index.js";
    import { navItems, navGroups } from "./pages/index.js";
    import { start, navigate, getRoute } from "./lib/router.js";

    // Wire <rurio-nav> with the grouped/sectioned structure.
    const nav = document.getElementById("rurio-nav");
    nav.groups = navGroups;

    const shell = document.querySelector(".app-shell");
    const backdrop = document.getElementById("nav-backdrop");
    const backBtn = document.getElementById("back-btn");
    const homeBtn = document.getElementById("home-btn");
    const headerAvatar = document.getElementById("header-avatar");
    const headerTitle = document.getElementById("header-title");

    function openNav()  { shell.setAttribute("data-nav-open", "true"); }
    function closeNav() { shell.removeAttribute("data-nav-open"); }

    // Drawer open is now triggered by the bottom-nav "Meniu" item via this event.
    document.addEventListener("rurio:nav-toggle", openNav);
    backdrop.addEventListener("click", closeNav);
    nav.addEventListener("click", (e) => {
      if (e.target.closest("[data-nav-item]")) closeNav();
    });

    // Pages whose header should show "back" instead of "home".
    // Includes the profile hub + all of its sub-pages.
    const BACK_PAGES = new Set([
      "profile",
      "profileinfo", "workspace", "securitate", "notificari", "preferinte",
      "dispozitive", "activitate", "termeni",
    ]);

    // Back button on mobile
    backBtn.addEventListener("click", () => {
      const r = getRoute();
      if (r.id) {
        navigate(`#/${r.page === "home" ? "" : r.page}`);
      } else if (BACK_PAGES.has(r.page)) {
        if (history.length > 1) {
          history.back();
        } else {
          // Profile itself falls back to home; profile sub-pages fall back to /profile.
          navigate(r.page === "profile" ? "#/" : "#/profile");
        }
      }
    });

    document.addEventListener("rurio:route-change", (e) => {
      const r = e.detail;
      // Prefer the page module's own meta.label so sub-pages (hidden from nav)
      // still get a proper header title.
      const label = pages[r.page]?.meta?.label
                 ?? navItems.find(n => n.id === r.page)?.label
                 ?? "Rurio";
      headerTitle.textContent = label;
      // Show back when a detail is open OR when the page opts in (e.g. profile).
      const showBack = !!r.id || BACK_PAGES.has(r.page);
      backBtn.classList.toggle("hidden", !showBack);
      backBtn.classList.toggle("flex", showBack);
      homeBtn.classList.toggle("hidden", showBack);
      homeBtn.classList.toggle("flex", !showBack);
      // Hide the avatar on any profile/sub-page (where it's redundant) but keep
      // the 40×40 slot reserved so the centered title stays balanced.
      headerAvatar.classList.toggle("invisible", BACK_PAGES.has(r.page));
    });

    start();
  </script>
</body>
</html>
